<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blasphemous 2 Save Analyzer</title>
    <script type="module" src="%VITE_DIATOM_URL%/embed/tool-header.js"></script>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      aria-hidden="true"
      style="position: absolute"
    >
      <defs>
        <filter
          id="altar-figure-missing-tint"
          color-interpolation-filters="sRGB"
        >
          <feFlood flood-color="#373737" result="flood" />
          <feComposite in="flood" in2="SourceGraphic" operator="in" />
        </filter>
      </defs>
    </svg>
    <diatom-tool-header game="blasphemous-ii">
      <h1>Blasphemous 2 Save Analyzer</h1>
    </diatom-tool-header>
    <div id="root"></div>
    <diatom-tool-footer game="blasphemous-ii">
      <a href="https://github.com/The-Black-Lodge/blasphemous2-save-analyzer">Source on GitHub</a>
    </diatom-tool-footer>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
